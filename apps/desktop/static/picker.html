<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>TeamSphere – Share your screen</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <div class="picker">
      <header>
        <h1>Choose what to share</h1>
        <div class="tabs" role="tablist">
          <button role="tab" data-kind="screen" aria-selected="true">Screens</button>
          <button role="tab" data-kind="window" aria-selected="false">Windows</button>
        </div>
      </header>
      <ul id="grid" class="grid" role="listbox" aria-label="Sources"></ul>
      <footer class="row">
        <label class="audio"><input id="audio" type="checkbox" /> Include computer sound</label>
        <span class="spacer"></span>
        <button id="cancel" type="button">Cancel</button>
        <button id="share" class="primary" type="button" disabled>Share</button>
      </footer>
    </div>
    <script src="picker.js"></script>
  </body>
</html>
